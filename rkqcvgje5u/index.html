<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>お礼LINEメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #F3F5F7;
    --surface: #FFFFFF;
    --ink: #1E2638;
    --muted: #5B6477;
    --line: #DCE1E7;
    --accent: #1D6B5F;
    --accent-soft: #E2EFEB;
    --on-accent: #FFFFFF;
    --warn: #9A5B00;
    --warn-soft: #FFF3DC;
    --bubble: #EEF6F3;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #12161D;
      --surface: #1A2029;
      --ink: #E6E9EF;
      --muted: #9AA3B5;
      --line: #2C3442;
      --accent: #5FC2AE;
      --accent-soft: #1C3430;
      --on-accent: #0D1B18;
      --warn: #F2B458;
      --warn-soft: #3A2C14;
      --bubble: #1E2B29;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #12161D;
    --surface: #1A2029;
    --ink: #E6E9EF;
    --muted: #9AA3B5;
    --line: #2C3442;
    --accent: #5FC2AE;
    --accent-soft: #1C3430;
    --on-accent: #0D1B18;
    --warn: #F2B458;
    --warn-soft: #3A2C14;
    --bubble: #1E2B29;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    padding-inline: 16px;
    padding-block: 20px 40px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .layout { display: grid; gap: 20px; }
  @media (min-width: 880px) {
    .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
    .preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    display: grid;
    gap: 22px;
  }
  .step { display: grid; gap: 10px; }
  .step-head { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
  .step-no {
    width: 26px; height: 26px; border-radius: 50%;
    display: inline-grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
    font-size: 13px; font-weight: 700; flex: none;
  }
  .step-head small { font-weight: 400; color: var(--muted); font-size: 13px; }

  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .seg button {
    font: inherit;
    min-height: 62px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 6px;
    cursor: pointer;
    display: grid; align-content: center; gap: 2px;
    transition: border-color .15s, background .15s;
  }
  .seg button b { font-size: 16px; }
  .seg button span { font-size: 12px; color: var(--muted); }
  .seg button:hover { border-color: var(--accent); }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .seg button[aria-pressed="true"] span { color: var(--on-accent); opacity: .85; }

  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input[type="text"], textarea {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 10px;
    padding: 10px 12px; width: 100%;
  }
  input[type="text"]:focus, textarea:focus, button:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent);
    outline-offset: 1px; border-color: var(--accent);
  }
  #hitokoto { min-height: 72px; resize: vertical; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 13px;
    border: 1px dashed var(--line); background: var(--bg); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; text-align: left;
  }
  .chip:hover { border-color: var(--accent); border-style: solid; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }

  .preview .panel { gap: 14px; }
  .preview-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .preview-head h2 { font-size: 15px; margin: 0; }
  .tag { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .tag.edited { background: var(--warn-soft); color: var(--warn); }

  #message {
    min-height: 340px; resize: vertical;
    background: var(--bubble); border-color: transparent;
    line-height: 1.75; font-size: 15px;
    border-radius: 16px 16px 16px 4px;
  }
  .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .notice {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    background: var(--warn-soft); color: var(--warn);
    border-radius: 10px; padding: 10px 12px; font-size: 13px;
  }
  .notice button { font: inherit; font-size: 13px; }

  .actions { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
  .btn {
    font: inherit; font-weight: 700; cursor: pointer;
    border-radius: 10px; min-height: 54px; padding: 8px 14px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 17px; }
  .btn.small { min-height: 34px; padding: 4px 12px; font-weight: 500; border-radius: 8px; }
  .btn.link { border: none; background: none; color: inherit; text-decoration: underline; padding: 0; min-height: auto; font-weight: 500; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--bg);
    padding: 12px 18px; border-radius: 10px; font-size: 14px;
    max-width: calc(100% - 32px); text-align: center;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 420px) {
    .fields { grid-template-columns: 1fr; }
    .seg button b { font-size: 15px; }
  }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>お礼LINEメーカー</h1>
    <p>選ぶ → 一言入れる → コピーしてLINEに貼り付け</p>
  </header>

  <div class="layout">
    <section class="panel" aria-label="入力">
      <div class="step">
        <div class="step-head"><span class="step-no">1</span>今日の結果</div>
        <div class="seg" id="seg-result" role="group" aria-label="今日の結果">
          <button type="button" id="r-seiritsu" data-value="seiritsu" aria-pressed="true"><b>成立</b><span>買取できた</span></button>
          <button type="button" id="r-fuseiritsu" data-value="fuseiritsu" aria-pressed="false"><b>不成立</b><span>逃し</span></button>
          <button type="button" id="r-toiawase" data-value="toiawase" aria-pressed="false"><b>問い合わせ</b><span>値段つかず</span></button>
        </div>
      </div>

      <div class="step">
        <div class="step-head"><span class="step-no">2</span>来店回数</div>
        <div class="seg" id="seg-visit" role="group" aria-label="来店回数">
          <button type="button" id="v-1" data-value="1" aria-pressed="true"><b>1回目</b><span>はじめて</span></button>
          <button type="button" id="v-2" data-value="2" aria-pressed="false"><b>2回目</b><span>また来てくれた</span></button>
          <button type="button" id="v-3" data-value="3" aria-pressed="false"><b>3回目〜</b><span>いつもの方</span></button>
        </div>
      </div>

      <div class="step">
        <div class="step-head"><span class="step-no">3</span>名前 <small>空欄なら入りません</small></div>
        <div class="fields">
          <label for="customer">お客様のお名前
            <input type="text" id="customer" placeholder="例：山田" autocomplete="off">
          </label>
          <label for="staff">担当者名（次回も残ります）
            <input type="text" id="staff" placeholder="例：佐藤" autocomplete="off">
          </label>
        </div>
      </div>

      <div class="step">
        <div class="step-head"><span class="step-no">4</span>その方だけの一言 <small>接客中の話題を1文だけ</small></div>
        <textarea id="hitokoto" placeholder="例：お話されていた北海道旅行、楽しんできてくださいね！"></textarea>
        <div class="chips" id="chips"></div>
        <p class="hint">候補をタップすると入力欄に入ります。「〇〇」の部分だけ書き換えてください。</p>
      </div>
    </section>

    <section class="preview" aria-label="文面">
      <div class="panel">
        <div class="preview-head">
          <h2>送る文面</h2>
          <span class="tag" id="state-tag">たたき台</span>
        </div>

        <div class="notice" id="stale" hidden>
          <span>選択が変わりました。手直しした文面はそのままです。</span>
          <button type="button" class="btn small" id="rebuild">たたき台を作り直す</button>
        </div>

        <textarea id="message" aria-label="送る文面（自由に編集できます）"></textarea>
        <div class="meta">
          <span>文面は自由に書き換えられます</span>
          <span id="count">0文字</span>
        </div>

        <div class="notice" id="placeholder-warn" hidden>
          <span>「〇〇」が残っています。書き換えてから送りましょう。</span>
        </div>

        <div class="actions">
          <button type="button" class="btn primary" id="copy">コピーする</button>
          <button type="button" class="btn" id="next">次のお客様へ</button>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  // ===== テンプレート（ここを書き換えれば全員の文面が変わります） =====
  // {staff} は担当者名に置き換わります
  var OPENING = {
    1: "本日はご来店いただき、ありがとうございました！\n担当させていただいた{staff}です😊",
    2: "本日もご来店いただき、ありがとうございました！\nまたお越しいただけて、とても嬉しかったです😊\n担当の{staff}です。",
    3: "いつもご利用いただき、ありがとうございます！\n今回も担当させていただき、ありがとうございました😊\n{staff}です。"
  };
  var RESULT = {
    seiritsu: "大切なお品物をお任せいただき、ありがとうございました。",
    fuseiritsu: "数あるお店の中から当店を選んでいただき、ありがとうございました。\n大切なお品物を拝見でき、お話を伺えてとても嬉しかったです。\n\n相場は日々変わりますので、今回のお品物も、お気持ちが固まったタイミングでまたいつでもお持ちください。\n次回もしっかり査定させていただきます！",
    toiawase: "本日はお品物をお持ちいただき、ありがとうございました。\n今回しっかり確認できたことで、お品物の整理やお片付けの進め方も決めやすくなったかと思います。\n\nほかにも「これはどうだろう？」と気になるお品物があれば、いつでもお気軽にお持ちください！"
  };
  var CLOSING = {
    1: "「これって売れるのかな？」くらいでも大丈夫ですので、お気軽にこちらのLINEにご連絡ください！\nまたお会いできるのを楽しみにしております！",
    2: "また何かございましたら、査定だけでも大丈夫ですので、いつでもお気軽にご相談ください！\nまたお会いできるのを楽しみにしております！",
    3: "「これってどうなんだろう？」というご相談だけでも大歓迎です。\n今後ともよろしくお願いいたします！"
  };
  var CHIPS_COMMON = [
    "〇〇のお話、とても楽しかったです！",
    "お話されていた〇〇、楽しんできてくださいね！",
    "お話されていた〇〇も、気になった際はいつでもご相談ください！"
  ];
  var CHIPS_BY_RESULT = {
    seiritsu: ["お持ちいただいた〇〇、大切にされていたのが伝わりました。"],
    fuseiritsu: [
      "今回の〇〇、手放そうと思われた際は、ぜひまた一番にご相談ください！",
      "〇〇の件、他のお店と比べていただいてからでも大歓迎です。",
      "〇〇以外にも気になるお品物があれば、一緒にお持ちください！"
    ],
    toiawase: [
      "〇〇のお片付け、スッキリ進むといいですね！",
      "〇〇の整理で迷われることがあれば、いつでもご相談ください！",
      "〇〇以外にも、お家に眠っているお品物があればぜひ見せてください！"
    ]
  };
  function seasonalChip() {
    var m = new Date().getMonth() + 1;
    if (m === 12 || m <= 2) return "寒い日が続きますので、お体にお気をつけください。";
    if (m <= 5) return "過ごしやすい季節になりましたね。お出かけの際はぜひお立ち寄りください。";
    if (m <= 8) return "暑い日が続きますので、どうぞご自愛ください。";
    return "朝晩冷えてきましたので、お体にお気をつけください。";
  }
  // ==================================================================

  var state = { result: "seiritsu", visit: "1", edited: false, lastBuilt: "" };
  var $ = function (id) { return document.getElementById(id); };
  var msg = $("message"), hitokoto = $("hitokoto"), customer = $("customer"), staff = $("staff");

  try { staff.value = localStorage.getItem("thanks-line-staff") || ""; } catch (e) {}

  function build() {
    var staffName = staff.value.trim() || "〇〇";
    var parts = [];
    var name = customer.value.trim();
    if (name) parts.push(name.replace(/(様|さん)$/, "") + "様");
    parts.push(OPENING[state.visit].replace("{staff}", staffName));
    parts.push(RESULT[state.result]);
    var h = hitokoto.value.trim();
    if (h) parts.push(h);
    parts.push(CLOSING[state.visit]);
    return parts.join("\n\n");
  }

  function renderChips() {
    var list = CHIPS_BY_RESULT[state.result].concat(CHIPS_COMMON, [seasonalChip()]);
    var box = $("chips");
    box.innerHTML = "";
    list.forEach(function (text) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = text;
      b.addEventListener("click", function () {
        hitokoto.value = text;
        hitokoto.focus();
        var i = text.indexOf("〇〇");
        if (i >= 0) hitokoto.setSelectionRange(i, i + 2);
        update();
      });
      box.appendChild(b);
    });
  }

  function refreshMeta() {
    $("count").textContent = msg.value.length + "文字";
    $("placeholder-warn").hidden = msg.value.indexOf("〇〇") < 0;
    var tag = $("state-tag");
    tag.textContent = state.edited ? "手直し中" : "たたき台";
    tag.classList.toggle("edited", state.edited);
  }

  function update() {
    var built = build();
    if (!state.edited) {
      msg.value = built;
      $("stale").hidden = true;
    } else {
      $("stale").hidden = built === state.lastBuilt;
    }
    if (!state.edited) state.lastBuilt = built;
    refreshMeta();
  }

  function rebuild() {
    state.edited = false;
    update();
  }

  function bindSeg(groupId, key) {
    var buttons = $(groupId).querySelectorAll("button");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        state[key] = btn.dataset.value;
        buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
        if (key === "result") renderChips();
        update();
      });
    });
  }
  function select(groupId, value) {
    $(groupId).querySelectorAll("button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.value === value));
    });
  }

  bindSeg("seg-result", "result");
  bindSeg("seg-visit", "visit");
  [customer, hitokoto].forEach(function (el) { el.addEventListener("input", update); });
  staff.addEventListener("input", function () {
    try { localStorage.setItem("thanks-line-staff", staff.value.trim()); } catch (e) {}
    update();
  });
  msg.addEventListener("input", function () {
    if (!state.edited) { state.edited = true; }
    refreshMeta();
  });
  $("rebuild").addEventListener("click", rebuild);

  var toastTimer;
  function toast(text) {
    var t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  $("copy").addEventListener("click", function () {
    var text = msg.value;
    var fallback = function () {
      msg.focus(); msg.select();
      toast("文面を選択しました。長押しして「コピー」を選んでください");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast("コピーしました。LINEに貼り付けて送信してください");
      }, fallback);
    } else {
      fallback();
    }
  });

  $("next").addEventListener("click", function () {
    customer.value = ""; hitokoto.value = "";
    state.result = "seiritsu"; state.visit = "1";
    select("seg-result", "seiritsu"); select("seg-visit", "1");
    renderChips();
    rebuild();
    window.scrollTo({ top: 0, behavior: "smooth" });
    toast("入力をクリアしました");
  });

  renderChips();
  update();
})();
</script>
</body>
</html>
